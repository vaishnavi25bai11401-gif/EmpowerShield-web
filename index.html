    <script>
      // Register Service Worker for 100% offline functionality
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>

<script>

  };

  // Initialize Firebase and Firestore
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // Helper function to write data (SOS alerts, logs, etc.) to Firestore
  function saveIncident(incidentData) {
    db.collection("incidents").add({
      ...incidentData,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    })
    .then((docRef) => console.log("Incident saved with ID:", docRef.id))
    .catch((error) => console.error("Error saving incident:", error));
  }
</script>
